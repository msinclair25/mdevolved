<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Not found — MDevolved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #10120f;
        color: #f4f4ec;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(620px, calc(100% - 40px));
      }
      p {
        color: #a9ada2;
        line-height: 1.7;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 500;
        letter-spacing: -0.06em;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 999px;
        background: #d7ff64;
        color: #090a08;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #90a5ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404 · Page not found</p>
      <h1>Nothing here.</h1>
      <p>
        This address may be old, or there may be a typo in it. The home page is
        still where you left it.
      </p>
      <a href="/">Return to MDevolved</a>
    </main>
  </body>
</html>
