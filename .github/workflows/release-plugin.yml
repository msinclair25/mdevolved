name: Package MDevolved Sync for Obsidian

on:
  push:
    tags:
      - "mdevolved-sync-v*"

permissions:
  contents: read

jobs:
  package-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package:plugin
      - name: Require the tagged commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # This monorepo cannot use its automatic GITHUB_TOKEN to publish into
      # the separate canonical distribution repository. Keep this workflow
      # read-only and promote the verified artifact to msinclair25/mdevolved-sync
      # only through the owner-authorized release procedure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdevolved-sync-${{ github.ref_name }}
          path: |
            packages/obsidian-plugin/release/LICENSE
            packages/obsidian-plugin/release/UPSTREAM.md
            packages/obsidian-plugin/release/main.js
            packages/obsidian-plugin/release/manifest.json
            packages/obsidian-plugin/release/styles.css
            packages/obsidian-plugin/release/checksums.txt
            packages/obsidian-plugin/release/mdevolved-sync-*.zip
          if-no-files-found: error
