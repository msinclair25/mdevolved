name: Release MDevolved

on:
  push:
    tags:
      - "mdevolved-v*"

permissions:
  contents: read

jobs:
  package-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/mdevolved-release-contract.mjs "$GITHUB_REF_NAME"
        shell: bash
      - run: pnpm test:md2:acceptance
      - run: pnpm package:desktop:release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mdevolved-sync-${{ runner.os }}-${{ runner.arch }}
          path: dist/mdevolved-desktop/*
          if-no-files-found: error

  publish-release:
    needs: package-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mdevolved-sync-*
          path: release
          merge-multiple: true
      - run: >-
          node scripts/package-mdevolved-desktop-release.mjs
          --verify release
          --expected-count 3
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --prerelease
          --verify-tag
          --generate-notes
          --title "MDevolved Sync ${GITHUB_REF_NAME#mdevolved-v}"
