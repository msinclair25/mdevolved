name: Release MDevolved

on:
  push:
    tags:
      - "mdevolved-v*"

permissions:
  contents: read

jobs:
  package-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/mdevolved-release-contract.mjs "$GITHUB_REF_NAME"
        shell: bash
      - run: pnpm test:md2:acceptance
      - run: pnpm package:desktop:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdevolved-sync-${{ runner.os }}-${{ runner.arch }}
          path: dist/mdevolved-desktop/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: package-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mdevolved-sync-*
          path: release
          merge-multiple: true
      - run: >-
          node scripts/package-mdevolved-desktop-release.mjs
          --verify release
          --expected-count 3
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --prerelease
          --verify-tag
          --generate-notes
          --title "MDevolved Sync ${GITHUB_REF_NAME#mdevolved-v}"
