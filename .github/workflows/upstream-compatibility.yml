name: Monitor upstream compatibility

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-compatibility
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - run: node --test scripts/check-upstream-compatibility.test.mjs
      - run: node scripts/check-upstream-compatibility.mjs --sync-issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
