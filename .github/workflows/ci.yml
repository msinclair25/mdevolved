name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm public-source:check
      - name: Run the frozen identity compatibility contract
        run: pnpm test:md7:brand
      - run: pnpm check
      - run: pnpm test:migrations
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm deploy:dry-run
      - run: pnpm deploy:marketing:dry-run
